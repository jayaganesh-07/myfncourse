<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
   <center>
     <div>
       
    <h2>Login Form</h2>

    <form>

        <label>Username</label>
        <input type="text" required  placeholder="Enter username" required minlength="4" maxlength="15"><br><br>

        <label>Password</label>
        <input type="password" required placeholder="Enter password" required minlength="6" maxlength="12"><br><br>

        <input type="submit" value="Login">

    </form>
    </div>
    
   </center>
</body>
</html>
