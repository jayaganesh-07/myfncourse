<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SafeLife Insurance</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen">

<div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

    <div class="text-center mb-6">
        <h1 class="text-5xl">🛡️</h1>

        <h2 class="text-3xl font-bold text-blue-900 mt-2">
            Admin Login
        </h2>

        <p class="text-gray-500 mt-2">
            Login to Admin Dashboard
        </p>
    </div>

    <div class="mb-5">
        <label class="block font-semibold mb-2">Admin ID</label>

        <input
            type="text"
            id="adminId"
            placeholder="Enter Admin ID"
            class="w-full border rounded-lg px-4 py-3">
    </div>

    <div class="mb-5">
        <label class="block font-semibold mb-2">Password</label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
            class="w-full border rounded-lg px-4 py-3">
    </div>

    <button
        onclick="adminLogin()"
        class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700">
        Login
    </button>

    <a href="login.html"
       class="block text-center mt-4 text-blue-700 hover:underline">
        ← Back to User Login
    </a>

</div>

<script>
function adminLogin() {

    const id = document.getElementById("adminId").value.trim();
    const password = document.getElementById("adminPassword").value;

    if (id === "admin" && password === "admin123") {

        alert("Admin Login Successful!");

        window.location.href = "admin.html";

    } else {

        alert("Invalid Admin ID or Password!");

    }

}
</script>

</body>
</html>
