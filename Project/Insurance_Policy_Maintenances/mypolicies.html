<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Policies</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-blue-900 text-white p-5 flex justify-between">
        <h1 class="text-3xl font-bold">🛡 SafeLife Insurance</h1>

        <a href="dashboard.html"
           class="bg-yellow-400 text-black px-5 py-2 rounded-lg">
            Back to Dashboard
        </a>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 bg-white shadow-xl rounded-xl p-8">

        <h1 class="text-4xl font-bold text-blue-900 mb-6">
            My Policies
        </h1>

        <table class="w-full text-center border">

            <thead class="bg-blue-900 text-white">
                <tr>
                    <th class="p-3">Policy ID</th>
                    <th>Policy Name</th>
                    <th>Premium</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr class="border-b">
                    <td class="p-3">PL101</td>
                    <td>Health Insurance</td>
                    <td>₹5,000</td>
                    <td class="text-green-600 font-bold">Active</td>
                </tr>

                <tr class="border-b">
                    <td class="p-3">PL102</td>
                    <td>Life Insurance</td>
                    <td>₹8,000</td>
                    <td class="text-yellow-500 font-bold">Pending</td>
                </tr>
            </tbody>

        </table>

    </div>

</body>
</html>
