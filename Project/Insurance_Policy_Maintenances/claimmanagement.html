<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Management | SafeLife Insurance</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<!-- Navbar -->

<nav class="bg-blue-900 text-white shadow-lg">

<div class="max-w-7xl mx-auto flex justify-between items-center p-5">

<h1 class="text-3xl font-bold">
🛡 SafeLife Admin
</h1>

<div class="flex gap-6">

<a href="admin.html" class="hover:text-yellow-300">Dashboard</a>

<a href="users.html" class="hover:text-yellow-300">Users</a>

<a href="approvepolicy.html" class="hover:text-yellow-300">Policy Approval</a>

<a href="claimmanagement.html" class="text-yellow-300 font-bold">Claims</a>

<a href="logout.html" class="hover:text-red-300">Logout</a>

</div>

</div>

</nav>

<!-- Heading -->

<div class="max-w-7xl mx-auto py-10">

<h2 class="text-4xl font-bold text-blue-900">
📋 Claim Management
</h2>

<p class="text-gray-500 mt-2">
Manage customer insurance claims.
</p>

<!-- Search -->

<div class="bg-white shadow rounded-xl p-5 mt-6">

<input
id="searchClaim"
type="text"
placeholder="Search Claim..."
class="w-full border rounded-lg p-3 outline-none">

</div>

<!-- Table -->

<div class="bg-white rounded-xl shadow-lg overflow-hidden mt-8">

<table class="w-full text-center">

<thead class="bg-blue-900 text-white">

<tr>

<th class="p-4">Claim ID</th>
<th>Customer</th>
<th>Policy</th>
<th>Amount</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="claimTable">

</tbody>

</table>

</div>

</div>

<!-- Footer -->

<footer class="bg-blue-900 text-white text-center py-5 mt-10">

<h2 class="text-xl font-bold">
🛡 SafeLife Insurance
</h2>

<p class="mt-2">
© 2026 SafeLife Insurance. All Rights Reserved.
</p>

</footer>

<script>

let claims = [

{
id:"CL001",
customer:"Jaya Ganesh",
policy:"Health Insurance",
amount:"₹50,000",
status:"Pending"
},

{
id:"CL002",
customer:"Vijay",
policy:"Vehicle Insurance",
amount:"₹1,20,000",
status:"Approved"
},

{
id:"CL003",
customer:"Ajith",
policy:"Life Insurance",
amount:"₹2,50,000",
status:"Pending"
},

{
id:"CL004",
customer:"Surya",
policy:"Travel Insurance",
amount:"₹30,000",
status:"Rejected"
}

];

const table=document.getElementById("claimTable");

function displayClaims(data=claims){

table.innerHTML="";

data.forEach((claim,index)=>{

table.innerHTML+=`

<tr class="border-b hover:bg-gray-100">

<td class="p-4">${claim.id}</td>

<td>${claim.customer}</td>

<td>${claim.policy}</td>

<td>${claim.amount}</td>

<td>

<span class="${
claim.status=="Approved"
?"text-green-600":
claim.status=="Rejected"
?"text-red-600":
"text-yellow-500"
} font-bold">

${claim.status}

</span>

</td>

<td>

<button
onclick="approveClaim(${index})"
class="bg-green-600 text-white px-3 py-2 rounded hover:bg-green-700">

Approve

</button>

<button
onclick="rejectClaim(${index})"
class="bg-red-600 text-white px-3 py-2 rounded ml-2 hover:bg-red-700">

Reject

</button>

</td>

</tr>

`;

});

}

displayClaims();

function approveClaim(index){

claims[index].status="Approved";

displayClaims();

}

function rejectClaim(index){

claims[index].status="Rejected";

displayClaims();

}

document.getElementById("searchClaim").addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=claims.filter(c=>

c.customer.toLowerCase().includes(value) ||

c.policy.toLowerCase().includes(value) ||

c.id.toLowerCase().includes(value)

);

displayClaims(filtered);

});

</script>

</body>
</html>
