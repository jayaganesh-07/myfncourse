<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeLife Insurance</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen">

    <!-- Login Card -->
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

        <div class="text-center mb-6">
            <h1 class="text-5xl">🛡️</h1>
            <h2 class="text-3xl font-bold text-blue-900 mt-2">
                SafeLife Insurance
            </h2>
            <p class="text-gray-500 mt-2">
                Login to your account
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <!-- Email -->
            <div class="mb-5">
                <label class="block font-semibold mb-2">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-5">
                <label class="block font-semibold mb-2">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>

            <!-- Remember Me -->
            <div class="flex justify-between items-center mb-6">

                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#" class="text-blue-700 hover:underline">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                Login
            </button>

        </form>

        <!-- Register -->
        <p class="text-center mt-6">
            Don't have an account?
            <a href="register.html" class="text-blue-700 font-semibold hover:underline">
                Register
            </a>
        </p>

    </div>

  <script>
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    // Get input values
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Get user from localStorage
    const user = JSON.parse(localStorage.getItem("user"));

    // Check if user exists
    if (user === null) {
        alert("Please register first.");
        return;
    }

    // Validate login
    if (email === user.email && password === user.password) {
        alert("Login Successful!");
        window.location.href = "dashboard.html";
    } else {
        alert("Invalid Email or Password!");
    }
});
</script>

</body>
</html>
