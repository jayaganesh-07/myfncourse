<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeLife Insurance</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen">

    <!-- Login Card -->
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

        <div class="text-center mb-6">
            <h1 class="text-4xl">🛡️</h1>
            <h2 class="text-3xl font-bold text-blue-900 mt-2">
                SafeLife Insurance
            </h2>
            <p class="text-gray-500 mt-2">
                Login to your account
            </p>
        </div>

        <form id="loginForm">

            <!-- Email -->
            <div class="mb-5">
                <label class="block font-semibold mb-2">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Password -->
            <div class="mb-2">
                <label class="block font-semibold mb-2">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Remember & Forgot -->
            <div class="flex justify-between items-center mt-4 mb-6">

                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    <span>Remember Me</span>
                </label>

                <a href="#" class="text-blue-700 hover:underline">
                    Forgot Password?
                </a>

            </div>

            <!-- Login Button -->
           <button
    type="button"
    onclick="window.location.href='dashboard.html'"
    class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700">
    Login
</button>

        </form>

        <!-- Register Link -->
        <p class="text-center mt-6">
            Don't have an account?
            <a href="register.html" class="text-blue-700 font-semibold hover:underline">
                Register
            </a>
        </p>

       

    </div>

   

</body>
</html>
