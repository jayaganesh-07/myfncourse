<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SafeLife Insurance</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen">

<div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

    <div class="text-center">
        <h1 class="text-5xl">🔒</h1>
        <h2 class="text-3xl font-bold text-blue-900 mt-3">
            Forgot Password
        </h2>
        <p class="text-gray-500 mt-2">
            Reset your SafeLife account password
        </p>
    </div>

    <form id="forgotForm" class="mt-8">

        <div class="mb-5">
            <label class="block font-semibold mb-2">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                class="w-full border rounded-lg px-4 py-3"
                required>
        </div>

        <div class="mb-5">
            <label class="block font-semibold mb-2">New Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                class="w-full border rounded-lg px-4 py-3"
                required>
        </div>

        <div class="mb-6">
            <label class="block font-semibold mb-2">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                class="w-full border rounded-lg px-4 py-3"
                required>
        </div>

        <button
            type="submit"
            class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700">
            Reset Password
        </button>

    </form>

    <p class="text-center mt-6">
        <a href="login.html" class="text-blue-900 font-bold hover:underline">
            Back to Login
        </a>
    </p>

</div>

<script>

const forgotForm = document.getElementById("forgotForm");

forgotForm.addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const user = JSON.parse(localStorage.getItem("user"));

    if(!user){
        alert("No registered user found.");
        return;
    }

    if(email !== user.email){
        alert("Email not found.");
        return;
    }

    if(newPassword !== confirmPassword){
        alert("Passwords do not match.");
        return;
    }

    user.password = newPassword;

    localStorage.setItem("user", JSON.stringify(user));

    alert("Password Updated Successfully!");

    window.location.href = "login.html";

});

</script>

</body>
</html>
