<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | SafeLife Insurance</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-10 text-center">

        <div class="text-6xl">
            👋
        </div>

        <h1 class="text-4xl font-bold text-blue-900 mt-4">
            Logout
        </h1>

        <p class="text-gray-600 mt-4">
            Are you sure you want to logout from your SafeLife Insurance account?
        </p>

        <div class="flex justify-center gap-5 mt-8">

            <button
                id="logoutBtn"
                class="bg-red-600 text-white px-8 py-3 rounded-lg hover:bg-red-700 transition">
                Yes, Logout
            </button>

            <a href="dashboard.html"
               class="bg-blue-900 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition">
                Cancel
            </a>

        </div>

    </div>

    <script>
        document.getElementById("logoutBtn").addEventListener("click", function () {

            // Remove login session
            localStorage.removeItem("isLoggedIn");

            // Optional: Remove user data
            // localStorage.removeItem("user");

            alert("Logout Successful!");

            window.location.href = "login.html";

        });
    </script>

</body>
</html>
