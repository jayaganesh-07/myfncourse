<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200 flex justify-center items-center min-h-screen h-100">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">

        <h2 class="text-3xl font-bold text-center text-blue-900">
            User Registration
        </h2>

        <p class="text-center text-gray-500 mt-2 mb-6">
            Create your Insurance Account
        </p>

        <form id="registerForm">

            <!-- Full Name -->
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Mobile -->
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter mobile number"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Address -->
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Address</label>
                <textarea
                    id="address"
                    rows="3"
                    placeholder="Enter your address"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block mb-2 font-semibold">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label class="block mb-2 font-semibold">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button
                type="submit"
                class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700 transition">
                Register
            </button>

        </form>

        <p class="text-center mt-5">
            Already have an account?
            <a href="#" class="text-blue-700 font-semibold hover:underline">
                Login
            </a>
        </p>

    </div>

   

</body>
</html>
