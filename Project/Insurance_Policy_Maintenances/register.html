<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SafeLife Insurance</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="../assets/favicon.ico">

</head>

<body class="bg-gradient-to-r from-blue-100 to-blue-200">

    <div class="min-h-screen flex justify-center items-center p-8">

        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden flex w-full max-w-6xl">

            <!-- Left Side -->

            <div class="w-1/2 bg-blue-900 text-white flex flex-col justify-center items-center p-10">
                <img src="../assets/register.jpg" alt="Register"
                    class="w-full h-[250px] object-cover rounded-2xl shadow-xl">

                <h1 class="text-4xl font-bold mt-8">
                    SafeLife Insurance
                </h1>

                <p class="text-center mt-5 text-lg leading-8">

                    Join SafeLife Insurance and protect your future with
                    trusted insurance policies.

                </p>

                <div class="grid grid-cols-2 gap-5 mt-10">

                    <div class="bg-blue-800 p-5 rounded-xl text-center">
                        🏥
                        <h2 class="font-bold mt-2">
                            Health
                        </h2>
                    </div>

                    <div class="bg-blue-800 p-5 rounded-xl text-center">
                        🚗
                        <h2 class="font-bold mt-2">
                            Vehicle
                        </h2>
                    </div>

                    <div class="bg-blue-800 p-5 rounded-xl text-center">
                        ❤️
                        <h2 class="font-bold mt-2">
                            Life
                        </h2>
                    </div>

                    <div class="bg-blue-800 p-5 rounded-xl text-center">
                        ✈️
                        <h2 class="font-bold mt-2">
                            Travel
                        </h2>
                    </div>

                </div>

            </div>

            <!-- Right Side -->

            <div class="w-1/2 p-10">

                <h1 class="text-4xl font-bold text-blue-900 text-center">

                    Register

                </h1>

                <p class="text-center text-gray-500 mt-2">

                    Create Your Insurance Account

                </p>


                <form id="registerForm" class="mt-8 space-y-5">
                    <input id="fullname" type="text" placeholder="Full Name" class="w-full border rounded-lg p-3">
                    <input id="email" type="email" placeholder="Email" class="w-full border rounded-lg p-3">

                    <input id="mobile" type="text" placeholder="Mobile Number" class="w-full border rounded-lg p-3">

                    <textarea id="address" rows="3" placeholder="Address"
                        class="w-full border rounded-lg p-3"></textarea>

                    <input id="password" type="password" placeholder="Password" class="w-full border rounded-lg p-3">

                    <input id="confirmPassword" type="password" placeholder="Confirm Password"
                        class="w-full border rounded-lg p-3">

                    <button class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-700">

                        Register

                    </button>

                </form>

                <p class="text-center mt-6">

                    Already have an account?

                    <a href="login.html" class="text-blue-900 font-bold">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </div>



    <script>
        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const address = document.getElementById("address").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            // Empty validation
            if (
                fullname === "" ||
                email === "" ||
                mobile === "" ||
                address === "" ||
                password === "" ||
                confirmPassword === ""
            ) {
                alert("Please fill all fields.");
                return;
            }

            // Name validation
            if (fullname.length < 3) {
                alert("Name must contain at least 3 characters.");
                return;
            }

            // Email validation
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!email.match(emailPattern)) {
                alert("Please enter a valid email.");
                return;
            }

            // Mobile validation
            const mobilePattern = /^[0-9]{10}$/;

            if (!mobile.match(mobilePattern)) {
                alert("Enter a valid 10-digit mobile number.");
                return;
            }

            // Password validation
            if (password.length < 6) {
                alert("Password must contain at least 6 characters.");
                return;
            }

            // Confirm password
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            // Store data in localStorage
            const user = {
                fullname,
                email,
                mobile,
                address,
                password
            };

            localStorage.setItem("user", JSON.stringify(user));

            alert("Registration Successful!");

            registerForm.reset();

            window.location.href = "login.html";
        });
    </script>

</body>

</html>
