<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - SafeLife Insurance</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between pt-20">

  <div id="navbar-header"></div>

  <main class="flex-1 flex items-center justify-center p-4 py-12">
    <div class="max-w-md w-full bg-slate-900 rounded-3xl p-8 border border-slate-800 shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto border border-emerald-500/30">
          <i class="fa-solid fa-user-shield text-2xl"></i>
        </div>
        <h2 class="text-2xl font-black text-white tracking-tight">Admin System Gateway</h2>
        <p class="text-xs text-slate-400">Authorized personnel access only.</p>
      </div>

      <!-- Instant Admin Demo Credentials Button -->
      <div class="p-3 bg-slate-800/80 rounded-2xl border border-slate-700/80 text-center space-y-2">
        <span class="text-[10px] uppercase font-bold text-slate-400 block">Pre-filled Admin Credentials</span>
        <button id="demo-admin-btn" type="button" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-key"></i> Load Admin Credentials
        </button>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Admin Email</label>
          <input type="email" id="email" required placeholder="admin@safelife.com" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Security Key</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg shadow-emerald-500/20 transition-all text-sm flex items-center justify-center gap-2">
          <i class="fa-solid fa-lock-open"></i> Authenticate Session
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-800">
        <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors">← Back to Customer Portal</a>
      </div>

    </div>
  </main>

  <div id="footer-section"></div>

  <script src="js/db.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
