<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - SafeLife Insurance</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between pt-20">

  <div id="navbar-header"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    
    <!-- User Welcome Header -->
    <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-brand-900 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
      <div class="space-y-2">
        <span class="px-3 py-1 bg-white/10 backdrop-blur-md rounded-full text-xs font-semibold text-brand-300">Customer Portal</span>
        <h1 class="text-3xl font-black tracking-tight">Welcome back, <span id="user-welcome-name">Valued Customer</span>! 👋</h1>
        <p class="text-xs text-slate-300">Here is your active coverage summary and insurance claim status.</p>
      </div>

      <div class="flex flex-wrap gap-3">
        <a href="policies.html" class="px-5 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 font-bold text-xs text-white shadow-lg transition-all flex items-center gap-2">
          <i class="fa-solid fa-shield-plus"></i> Buy New Policy
        </a>
        <button id="file-claim-btn" class="px-5 py-3 rounded-xl bg-white/10 hover:bg-white/20 backdrop-blur-md font-bold text-xs text-white transition-all flex items-center gap-2">
          <i class="fa-solid fa-file-invoice-dollar"></i> File a Claim
        </button>
      </div>
    </div>

    <!-- Overview Stats Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      
      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-shield"></i>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase">Total Coverage</span>
          <h3 id="stat-total-coverage" class="text-2xl font-black text-slate-900">$0</h3>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase">Active Policies</span>
          <h3 id="stat-active-policies" class="text-2xl font-black text-slate-900">0</h3>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase">Monthly Premium</span>
          <h3 id="stat-monthly-premium" class="text-2xl font-black text-slate-900">$0/mo</h3>
        </div>
      </div>

      <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-file-invoice"></i>
        </div>
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase">Claims Filed</span>
          <h3 id="stat-claims-submitted" class="text-2xl font-black text-slate-900">0</h3>
        </div>
      </div>

    </div>

    <!-- Active Policies Section -->
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm space-y-6">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-slate-900">My Enrolled Policies</h3>
        <a href="policies.html" class="text-xs font-bold text-brand-600 hover:underline">Explore Catalog <i class="fa-solid fa-chevron-right text-[10px]"></i></a>
      </div>

      <div id="user-policies-list" class="space-y-4">
        <!-- Injected dynamically by dashboard.js -->
      </div>
    </div>

    <!-- Recent Claims Status -->
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm space-y-6">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-bold text-slate-900">Recent Claim Activity</h3>
      </div>

      <div id="user-claims-list" class="space-y-3">
        <!-- Injected dynamically by dashboard.js -->
      </div>
    </div>

  </main>

  <div id="footer-section"></div>

  <script src="js/db.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
