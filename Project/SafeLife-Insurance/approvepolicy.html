<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve Policies - SafeLife Insurance Admin</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between pt-20">

  <div id="navbar-header"></div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    
    <!-- Admin Navigation Bar -->
    <div class="bg-slate-800/90 rounded-2xl p-3 border border-slate-700 shadow-xl flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
        <a href="admin.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-chart-line mr-1"></i> Dashboard
        </a>
        <a href="users.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-users mr-1"></i> User Management
        </a>
        <a href="approvepolicy.html" class="px-4 py-2.5 rounded-xl bg-brand-600 text-white shadow-md">
          <i class="fa-solid fa-file-signature mr-1"></i> Policy Applications
        </a>
        <a href="claimmanagement.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-hand-holding-dollar mr-1"></i> Claim Hub
        </a>
        <a href="reports.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-chart-pie mr-1"></i> Analytics & Reports
        </a>
        <a href="feedback.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-comments mr-1"></i> Feedback
        </a>
        <a href="messages.html" class="px-4 py-2.5 rounded-xl text-slate-300 hover:bg-slate-700 transition-colors">
          <i class="fa-solid fa-inbox mr-1"></i> Messages Inbox
        </a>
      </div>
    </div>

    <div>
      <h1 class="text-2xl font-black text-white">Policy Enrollment Applications</h1>
      <p class="text-xs text-slate-400 mt-1">Review pending customer insurance applications, verify nominees, and set approval status.</p>
    </div>

    <div class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-100 text-slate-900">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 border-b border-slate-200 text-[11px] uppercase font-bold text-slate-500">
              <th class="px-6 py-3.5">App ID</th>
              <th class="px-6 py-3.5">Applicant</th>
              <th class="px-6 py-3.5">Policy Requested</th>
              <th class="px-6 py-3.5">Nominee</th>
              <th class="px-6 py-3.5">Monthly Premium</th>
              <th class="px-6 py-3.5">Status</th>
              <th class="px-6 py-3.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="policy-apps-tbody">
            <!-- Injected dynamically -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="footer-section"></div>

  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const admin = requireAdmin();
      if (!admin) return;

      renderPolicyApps();
    });

    function renderPolicyApps() {
      const tbody = document.getElementById('policy-apps-tbody');
      if (!tbody) return;

      const userPolicies = getItem(DB_KEYS.USER_POLICIES);

      if (userPolicies.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-8 text-center text-slate-400">No policy applications submitted.</td></tr>`;
        return;
      }

      tbody.innerHTML = userPolicies.map(p => `
        <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
          <td class="px-6 py-4 font-mono font-bold text-slate-700">${p.id}</td>
          <td class="px-6 py-4">
            <h5 class="font-bold text-slate-900">${p.userName}</h5>
            <span class="text-xs text-slate-400">${p.userEmail}</span>
          </td>
          <td class="px-6 py-4 font-semibold text-slate-800">${p.policyTitle}</td>
          <td class="px-6 py-4 text-xs font-medium text-slate-600">${p.nominee || 'N/A'}</td>
          <td class="px-6 py-4 font-black text-brand-600">$${p.monthlyPremium}/mo</td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 text-xs font-bold rounded-full uppercase ${
              p.status === 'Approved' ? 'bg-emerald-100 text-emerald-700' :
              p.status === 'Rejected' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'
            }">${p.status}</span>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            ${p.status === 'Pending' ? `
              <button onclick="updatePolicyStatus('${p.id}', 'Approved')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm transition-colors">
                Approve
              </button>
              <button onclick="updatePolicyStatus('${p.id}', 'Rejected')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-600 text-white hover:bg-rose-700 shadow-sm transition-colors">
                Reject
              </button>
            ` : `
              <span class="text-xs font-semibold text-slate-400">Processed</span>
            `}
          </td>
        </tr>
      `).join('');
    }

    window.updatePolicyStatus = function(appId, status) {
      const userPolicies = getItem(DB_KEYS.USER_POLICIES);
      const app = userPolicies.find(p => p.id === appId);
      if (!app) return;

      app.status = status;
      setItem(DB_KEYS.USER_POLICIES, userPolicies);

      addNotification(app.userId, `Policy ${status}`, `Your policy application for ${app.policyTitle} has been ${status.toLowerCase()}.`, status === 'Approved' ? 'success' : 'error');

      showToast(`Application #${appId} updated to ${status}`, 'success');
      renderPolicyApps();
    };
  </script>
</body>
</html>
