<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - SafeLife Insurance</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between pt-20">

  <div id="navbar-header"></div>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-8">
    
    <div class="border-b border-slate-200 pb-6">
      <h1 class="text-3xl font-black text-slate-900 tracking-tight">Account Settings</h1>
      <p class="text-sm text-slate-500 mt-1">Manage your personal profile, contact information, and security preferences.</p>
    </div>

    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-xl space-y-6">
      <form id="settings-form" class="space-y-6">
        
        <div class="flex items-center gap-6 pb-6 border-b border-slate-100">
          <img id="settings-avatar-preview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-20 h-20 rounded-full object-cover border-2 border-brand-500 shadow-md">
          <div class="space-y-1">
            <h4 class="font-bold text-slate-900 text-lg" id="settings-name-heading">User Profile</h4>
            <p class="text-xs text-slate-400">Update photo URL below</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" id="settings-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
            <input type="email" id="settings-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
            <input type="tel" id="settings-phone" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Avatar Image URL</label>
            <input type="url" id="settings-avatar-url" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
          </div>
        </div>

        <div class="pt-4 border-t border-slate-100 space-y-4">
          <h4 class="font-bold text-slate-900 text-sm uppercase tracking-wider">Change Password</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">New Password</label>
              <input type="password" id="settings-new-pass" placeholder="Leave blank to keep current" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Confirm New Password</label>
              <input type="password" id="settings-confirm-pass" placeholder="Leave blank to keep current" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
            </div>
          </div>
        </div>

        <button type="submit" class="px-8 py-3.5 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/25 transition-all text-sm">
          Save Profile Changes
        </button>
      </form>
    </div>

  </main>

  <div id="footer-section"></div>

  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = requireAuth();
      if (!user) return;

      document.getElementById('settings-name').value = user.name;
      document.getElementById('settings-email').value = user.email;
      document.getElementById('settings-phone').value = user.phone || '';
      document.getElementById('settings-avatar-url').value = user.avatar || '';
      document.getElementById('settings-avatar-preview').src = user.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150';
      document.getElementById('settings-name-heading').textContent = user.name;

      document.getElementById('settings-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const newName = document.getElementById('settings-name').value.trim();
        const newEmail = document.getElementById('settings-email').value.trim();
        const newPhone = document.getElementById('settings-phone').value.trim();
        const newAvatar = document.getElementById('settings-avatar-url').value.trim();
        const newPass = document.getElementById('settings-new-pass').value;
        const confirmPass = document.getElementById('settings-confirm-pass').value;

        if (newPass && newPass !== confirmPass) {
          showToast('New passwords do not match!', 'error');
          return;
        }

        const users = getItem(DB_KEYS.USERS);
        const targetUser = users.find(u => u.id === user.id);
        if (!targetUser) return;

        targetUser.name = newName;
        targetUser.email = newEmail;
        targetUser.phone = newPhone;
        if (newAvatar) targetUser.avatar = newAvatar;
        if (newPass) targetUser.password = newPass;

        setItem(DB_KEYS.USERS, users);
        setCurrentUser(targetUser);

        showToast('Profile updated successfully!', 'success');
        setTimeout(() => location.reload(), 1000);
      });
    });
  </script>
</body>
</html>
