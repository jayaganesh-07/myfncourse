<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — SafeLife Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-[var(--sl-mint-50)]">
<div class="flex min-h-screen">
  <aside id="sidebar" class="hidden lg:flex w-64 shrink-0 bg-[var(--sl-teal-950)] p-5 flex-col fixed h-screen"></aside>
  <div class="flex-1 lg:ml-64">
    <header class="h-16 flex items-center px-5 sm:px-8 border-b hairline bg-[var(--sl-paper)]/80 backdrop-blur sticky top-0 z-30">
      <p class="font-display text-lg font-semibold text-[var(--sl-teal-950)]">Messages</p>
    </header>
    <main class="p-5 sm:p-8">
      <h1 class="font-display text-3xl font-semibold text-[var(--sl-teal-950)] mb-1">Contact form messages</h1>
      <p class="text-sm text-[#5B7A72] mb-8">Messages submitted through the public contact page.</p>
      <div id="messages-list" class="space-y-4"></div>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  renderAdminSidebar('messages.html');

  function renderMessages(){
    const msgs = SL.all('messages');
    document.getElementById('messages-list').innerHTML = msgs.length ? msgs.map(m=>`
      <div class="card p-6">
        <div class="flex items-start justify-between gap-4 flex-wrap mb-2">
          <div>
            <p class="font-semibold text-sm text-[var(--sl-teal-950)]">${m.subject}</p>
            <p class="text-xs text-[#5B7A72]">${m.name} · ${m.email} · ${SL.fmtDate(m.date)}</p>
          </div>
          <span class="badge ${m.status==='closed'?'badge-closed':'badge-pending'}">${m.status}</span>
        </div>
        <p class="text-sm text-[#5B7A72] leading-relaxed mb-4">${m.message}</p>
        ${m.status==='open' ? `<button onclick="closeMsg('${m.id}')" class="btn-outline px-4 py-2 rounded-lg text-xs font-semibold">Mark as resolved</button>` : ''}
      </div>`).join('') : `<div class="card p-10 text-center text-sm text-[#5B7A72]">No messages yet.</div>`;
  }
  function closeMsg(id){
    const msgs = SL.all('messages');
    const m = msgs.find(x=>x.id===id); m.status = 'closed';
    SL.save('messages', msgs); renderMessages();
    toast('Message marked as resolved.', 'success');
  }
  renderMessages();
</script>
</body>
</html>
