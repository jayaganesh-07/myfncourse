<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SafeLife Insurance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-[var(--sl-mint-50)]">
<div class="flex min-h-screen">
  <aside id="sidebar" class="hidden lg:flex w-64 shrink-0 bg-[var(--sl-teal-950)] p-5 flex-col fixed h-screen"></aside>
  <div class="flex-1 lg:ml-64">
    <header class="h-16 flex items-center justify-between px-5 sm:px-8 border-b hairline bg-[var(--sl-paper)]/80 backdrop-blur sticky top-0 z-30">
      <p class="font-display text-lg font-semibold text-[var(--sl-teal-950)]">Notifications</p>
      <button onclick="markAllRead()" class="text-sm font-semibold text-[var(--sl-teal-800)]">Mark all read</button>
    </header>
    <main class="p-5 sm:p-8 max-w-2xl">
      <div id="notif-list" class="space-y-3"></div>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  const user = renderUserSidebar('notifications.html');

  function loadNotifs(){
    const notifs = SL.all('notifications').filter(n=>n.userId===user.id).sort((a,b)=>new Date(b.date)-new Date(a.date));
    document.getElementById('notif-list').innerHTML = notifs.length ? notifs.map(n=>`
      <div class="card p-5 flex gap-4 items-start ${n.read?'':'border-[var(--sl-gold-400)]'}">
        <span class="shield mt-0.5" style="--s:.75"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z" fill="currentColor"/></svg></span>
        <div class="flex-1">
          <div class="flex items-center justify-between gap-3">
            <p class="font-semibold text-sm text-[var(--sl-teal-950)]">${n.title}</p>
            ${n.read ? '' : '<span class="w-2 h-2 rounded-full bg-[var(--sl-gold-400)] shrink-0"></span>'}
          </div>
          <p class="text-sm text-[#5B7A72] mt-1">${n.message}</p>
          <p class="text-xs text-[#8FA8A0] mt-2">${SL.fmtDate(n.date)}</p>
        </div>
      </div>
    `).join('') : `<div class="card p-10 text-center text-sm text-[#5B7A72]">You're all caught up — no notifications yet.</div>`;
  }

  function markAllRead(){
    const notifs = SL.all('notifications');
    notifs.forEach(n=>{ if(n.userId===user.id) n.read = true; });
    SL.save('notifications', notifs);
    loadNotifs();
    renderUserSidebar('notifications.html');
    toast('All notifications marked as read.', 'success');
  }

  loadNotifs();
</script>
</body>
</html>
