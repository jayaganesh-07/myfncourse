<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — SafeLife Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-sans bg-[var(--sl-mint-50)]">
<div class="flex min-h-screen">
  <aside id="sidebar" class="hidden lg:flex w-64 shrink-0 bg-[var(--sl-teal-950)] p-5 flex-col fixed h-screen"></aside>
  <div class="flex-1 lg:ml-64">
    <header class="h-16 flex items-center justify-between px-5 sm:px-8 border-b hairline bg-[var(--sl-paper)]/80 backdrop-blur sticky top-0 z-30">
      <p class="font-display text-lg font-semibold text-[var(--sl-teal-950)]">Users</p>
      <input id="search-input" type="text" placeholder="Search by name or email…" class="input-field max-w-xs">
    </header>
    <main class="p-5 sm:p-8">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="font-display text-3xl font-semibold text-[var(--sl-teal-950)] mb-1">Registered users</h1>
          <p class="text-sm text-[#5B7A72]">Add, edit, block or remove policyholder accounts.</p>
        </div>
        <button onclick="openUserModal()" class="btn-gold px-5 py-2.5 rounded-lg font-semibold text-sm">+ Add user</button>
      </div>
      <div class="card overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-[var(--sl-mint-100)] text-left text-[#3D5751]">
            <tr><th class="px-5 py-3 font-semibold">Name</th><th class="px-5 py-3 font-semibold">Email</th><th class="px-5 py-3 font-semibold">Phone</th><th class="px-5 py-3 font-semibold">Joined</th><th class="px-5 py-3 font-semibold">Status</th><th class="px-5 py-3 font-semibold text-right">Actions</th></tr>
          </thead>
          <tbody id="users-table"></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<div id="user-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-5">
  <div class="card bg-white max-w-md w-full p-7">
    <h3 class="font-display text-xl font-semibold text-[var(--sl-teal-950)] mb-5" id="user-modal-title">Add user</h3>
    <form id="user-form" class="space-y-4">
      <input type="hidden" id="u-id">
      <div><label class="text-sm font-medium text-[var(--sl-teal-950)] block mb-1.5">Full name</label><input required id="u-name" type="text" class="input-field"></div>
      <div><label class="text-sm font-medium text-[var(--sl-teal-950)] block mb-1.5">Email</label><input required id="u-email" type="email" class="input-field"></div>
      <div><label class="text-sm font-medium text-[var(--sl-teal-950)] block mb-1.5">Phone</label><input required id="u-phone" type="tel" class="input-field"></div>
      <div><label class="text-sm font-medium text-[var(--sl-teal-950)] block mb-1.5">Password</label><input required id="u-password" type="text" class="input-field"></div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeUserModal()" class="btn-outline flex-1 py-2.5 rounded-lg font-semibold text-sm">Cancel</button>
        <button type="submit" class="btn-primary flex-1 py-2.5 rounded-lg font-semibold text-sm">Save user</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  renderAdminSidebar('users.html');
  let query = '';

  function renderUsers(){
    let users = SL.all('users');
    if(query) users = users.filter(u=>u.name.toLowerCase().includes(query)||u.email.toLowerCase().includes(query));
    document.getElementById('users-table').innerHTML = users.length ? users.map(u=>`
      <tr class="border-t hairline">
        <td class="px-5 py-3 font-medium text-[var(--sl-teal-950)]">${u.name}</td>
        <td class="px-5 py-3 text-[#5B7A72]">${u.email}</td>
        <td class="px-5 py-3 text-[#5B7A72]">${u.phone||'—'}</td>
        <td class="px-5 py-3 text-[#5B7A72]">${SL.fmtDate(u.joined)}</td>
        <td class="px-5 py-3"><span class="badge ${u.status==='blocked'?'badge-rejected':'badge-active'}">${u.status}</span></td>
        <td class="px-5 py-3 text-right space-x-2 whitespace-nowrap">
          <button onclick="editUser('${u.id}')" class="text-xs font-semibold text-[var(--sl-teal-800)]">Edit</button>
          <button onclick="toggleBlock('${u.id}')" class="text-xs font-semibold text-[var(--sl-gold-600)]">${u.status==='blocked'?'Unblock':'Block'}</button>
          <button onclick="deleteUser('${u.id}')" class="text-xs font-semibold text-[var(--sl-rust-600)]">Delete</button>
        </td>
      </tr>`).join('') : `<tr><td colspan="6" class="px-5 py-10 text-center text-sm text-[#5B7A72]">No users found.</td></tr>`;
  }

  document.getElementById('search-input').addEventListener('input', e=>{ query = e.target.value.toLowerCase(); renderUsers(); });

  function openUserModal(){
    document.getElementById('user-form').reset(); document.getElementById('u-id').value='';
    document.getElementById('user-modal-title').textContent = 'Add user';
    document.getElementById('user-modal').classList.remove('hidden'); document.getElementById('user-modal').classList.add('flex');
  }
  function closeUserModal(){ document.getElementById('user-modal').classList.add('hidden'); document.getElementById('user-modal').classList.remove('flex'); }

  function editUser(id){
    const u = SL.all('users').find(x=>x.id===id); if(!u) return;
    document.getElementById('u-id').value = u.id;
    document.getElementById('u-name').value = u.name;
    document.getElementById('u-email').value = u.email;
    document.getElementById('u-phone').value = u.phone;
    document.getElementById('u-password').value = u.password;
    document.getElementById('user-modal-title').textContent = 'Edit user';
    document.getElementById('user-modal').classList.remove('hidden'); document.getElementById('user-modal').classList.add('flex');
  }

  document.getElementById('user-form').addEventListener('submit', e=>{
    e.preventDefault();
    const id = document.getElementById('u-id').value;
    let users = SL.all('users');
    if(id){
      const idx = users.findIndex(u=>u.id===id);
      users[idx] = {...users[idx], name:document.getElementById('u-name').value, email:document.getElementById('u-email').value, phone:document.getElementById('u-phone').value, password:document.getElementById('u-password').value};
      toast('User updated.', 'success');
    } else {
      users.push({ id:SL.uid('USR'), name:document.getElementById('u-name').value, email:document.getElementById('u-email').value, phone:document.getElementById('u-phone').value, password:document.getElementById('u-password').value, joined:SL.nowISO(), status:'active' });
      toast('User added.', 'success');
    }
    SL.save('users', users);
    closeUserModal(); renderUsers();
  });

  function toggleBlock(id){
    const users = SL.all('users');
    const u = users.find(x=>x.id===id);
    u.status = u.status==='blocked' ? 'active' : 'blocked';
    SL.save('users', users); renderUsers();
    toast(`User ${u.status==='blocked'?'blocked':'unblocked'}.`, 'success');
  }
  function deleteUser(id){
    if(!confirm('Delete this user permanently?')) return;
    SL.save('users', SL.all('users').filter(u=>u.id!==id));
    renderUsers();
    toast('User deleted.', 'success');
  }

  renderUsers();
</script>
</body>
</html>
