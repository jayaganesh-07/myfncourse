<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports — SafeLife Admin</title>
<link rel="icon" href="assets/favicon.ico" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[var(--paper)] text-[var(--ink)]">

<div id="site-navbar"></div>

<header class="bg-[var(--harbor)] py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <p class="font-mono text-xs tracking-widest text-[var(--gold)] uppercase">Console</p>
    <h1 class="font-display text-3xl text-white mt-2">Reports & analytics</h1>
  </div>
</header>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div id="report-stats" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12"></div>

  <div class="grid lg:grid-cols-2 gap-8 mb-12">
    <div class="policy-card p-6">
      <h2 class="font-display text-lg mb-4">Applications by policy category</h2>
      <div id="chart-category" class="space-y-3"></div>
    </div>
    <div class="policy-card p-6">
      <h2 class="font-display text-lg mb-4">Claims by status</h2>
      <div id="chart-claims" class="space-y-3"></div>
    </div>
  </div>

  <div class="policy-card p-6">
    <h2 class="font-display text-lg mb-4">Policy application funnel</h2>
    <div id="chart-funnel" class="grid grid-cols-3 gap-4 text-center"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
