<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notifications — SafeLife Insurance</title>
<link rel="icon" href="assets/favicon.ico" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[var(--paper)] text-[var(--ink)]">

<div id="site-navbar"></div>

<header class="bg-[var(--harbor)] py-10">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
    <div>
      <p class="font-mono text-xs tracking-widest text-[var(--gold)] uppercase">Inbox</p>
      <h1 class="font-display text-3xl text-white mt-2">Notifications</h1>
    </div>
    <button id="mark-all-read" class="text-sm font-semibold bg-white/10 text-white px-4 py-2 rounded-full hover:bg-white/20">Mark all as read</button>
  </div>
</header>

<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div id="notif-list" class="space-y-3"></div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
