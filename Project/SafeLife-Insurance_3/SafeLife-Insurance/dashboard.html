<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — SafeLife Insurance</title>
<link rel="icon" href="assets/favicon.ico" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[var(--paper)] text-[var(--ink)]">

<div id="site-navbar"></div>

<header class="bg-[var(--harbor)] py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <p class="font-mono text-xs tracking-widest text-[var(--gold)] uppercase">Dashboard</p>
    <h1 id="dash-greeting" class="font-display text-3xl text-white mt-2">Welcome back</h1>
  </div>
</header>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div id="dash-stats" class="grid sm:grid-cols-3 gap-6 mb-12"></div>

  <div class="flex items-center justify-between mb-6">
    <h2 class="font-display text-2xl">My policies</h2>
    <a href="policies.html" class="text-sm font-semibold text-[var(--teal)] hover:underline">Browse more plans →</a>
  </div>
  <div id="my-policies" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-14"></div>

  <div class="flex items-center justify-between mb-6">
    <h2 class="font-display text-2xl">Recent claims</h2>
    <a href="policies.html#file-claim" class="text-sm font-semibold text-[var(--teal)] hover:underline">File a new claim →</a>
  </div>
  <div class="policy-card overflow-hidden">
    <div class="table-wrap">
      <table class="w-full text-sm">
        <thead class="bg-[var(--paper)] text-left text-xs uppercase tracking-widest text-gray-400">
          <tr><th class="py-3 px-5">Policy</th><th class="py-3 px-5">Reason</th><th class="py-3 px-5">Amount</th><th class="py-3 px-5">Filed</th><th class="py-3 px-5">Status</th></tr>
        </thead>
        <tbody id="dash-claims-body"></tbody>
      </table>
    </div>
  </div>

  <div class="mt-14 policy-card p-8 max-w-2xl">
    <h2 class="font-display text-xl mb-1">Share your feedback</h2>
    <p class="text-sm text-gray-500 mb-5">Tell us how your experience with SafeLife has been.</p>
    <form id="feedback-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Rating</label>
        <div id="feedback-stars" class="flex gap-1 text-2xl"></div>
        <input type="hidden" id="feedback-rating" value="5" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Your message</label>
        <textarea id="feedback-message" rows="3" required class="w-full border border-[var(--hairline)] rounded-lg px-4 py-2.5"></textarea>
      </div>
      <button type="submit" class="bg-[var(--teal)] text-white font-semibold px-6 py-2.5 rounded-lg hover:brightness-95">Submit feedback</button>
    </form>
  </div>
</section>

<!-- File a claim modal -->
<div id="claim-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="policy-card p-6 w-full max-w-md">
    <h3 class="font-display text-xl mb-4">File a claim</h3>
    <form id="claim-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Policy</label>
        <select id="claim-policy" class="w-full border border-[var(--hairline)] rounded-lg px-4 py-2.5"></select>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Claim amount (₹)</label>
        <input id="claim-amount" type="number" min="1" required class="w-full border border-[var(--hairline)] rounded-lg px-4 py-2.5" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Reason</label>
        <textarea id="claim-reason" rows="3" required class="w-full border border-[var(--hairline)] rounded-lg px-4 py-2.5"></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" id="claim-cancel" class="flex-1 border border-[var(--hairline)] rounded-lg py-2.5 font-medium">Cancel</button>
        <button type="submit" class="flex-1 bg-[var(--teal)] text-white rounded-lg py-2.5 font-semibold">Submit claim</button>
      </div>
    </form>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/claims.js"></script>
<script src="js/feedback.js"></script>
</body>
</html>
