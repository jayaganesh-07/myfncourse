<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer feedback — SafeLife Admin</title>
<link rel="icon" href="assets/favicon.ico" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[var(--paper)] text-[var(--ink)]">

<div id="site-navbar"></div>

<header class="bg-[var(--harbor)] py-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between flex-wrap gap-4">
    <div>
      <p class="font-mono text-xs tracking-widest text-[var(--gold)] uppercase">Console</p>
      <h1 class="font-display text-3xl text-white mt-2">Customer feedback</h1>
    </div>
    <div class="text-right text-white">
      <p class="font-mono text-[11px] text-white/50 uppercase">Average rating</p>
      <p id="feedback-avg" class="font-display text-2xl text-[var(--gold)]">—</p>
    </div>
  </div>
</header>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div id="feedback-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/feedback.js"></script>
</body>
</html>
