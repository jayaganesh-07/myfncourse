<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <div class="bg-white shadow-lg rounded-lg p-6 flex flex-col items-center w-80">
        
        <!-- Profile Image -->
        <img
            src="../../CSS/assets/image/vijay/vijay.jpg"
            alt="Profile"
            class="w-24 h-24 rounded-full object-cover"
        >

        <!-- Name -->
        <h2 class="text-xl font-bold mt-4">
           C.Joseph Vijay
        </h2>

        <!-- Role -->
        <p class="text-gray-500">
            Chief Minister
        </p>

        <!-- Follow Button -->
        <button class="mt-4 bg-blue-500 text-white px-5 py-2 rounded hover:bg-blue-600">
            Follow
        </button>

    </div>

</body>
</html>
