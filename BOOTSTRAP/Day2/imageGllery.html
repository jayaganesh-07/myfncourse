<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/1.png"
                 alt="Image 1"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/2.png"
                 alt="Image 2"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/3.png"
                 alt="Image 3"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/4.png"
                 alt="Image 4"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/5.png"
                 alt="Image 5"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../../CSS/assets/image/car/6.png"
                 alt="Image 6"
                 class="w-full hover:scale-110 transition duration-300">
        </div>

    </div>

</body>
</html>
