<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form>
            <h1>register here</h1>
            <input id="userName" type="text" placeholder="Enter name"><br><br>
            <input id="userEmail" type="email" placeholder="Enter email"><br><br>
            <input id="userPassword" type="password" placeholder="Create Password"><br><br>
            <button onclick="registerData(event)">Register</button>
        </form>
    </div>

     <script>
        
        const result =[]
        

       
        const registerData = (e)=>{
        
              e.preventDefault()

            const name = document.getElementById("userName").value 
            const email = document.getElementById("userEmail").value
            const pass = document.getElementById("userPassword").value
            const finalData = {name,email,pass}
            result.push(finalData)
            console.log(result)

            

           document.getElementById("userName").value = "";
           document.getElementById("userEmail").value = "";
           document.getElementById("userPassword").value = "";
            

           
        }
     </script>

</body>
</html>
